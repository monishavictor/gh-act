name: Sample CI

on:
  push:
    branches:
      - development
      - master
      - releases*

jobs:
  code-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 
    - name: Run pre-commit hooks & Type check
      id: code-checks
      run: |
        echo "in code-checks"
    - name:  Run Unit tests
      id: unit-tests
      run: |
        echo "in unit-tests"
    - name: Build Application container
      id: build-container
      run: |
        echo "in build application container"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: code-checks
    steps:
      - uses: actions/checkout@v4
      - name: E2E Tests
        with:
          bucket: 'bucket-value'
        uses: ./.github/actions/e2e-tests

  push-dev-registry:
    runs-on: ubuntu-latest
    if: github.ref_name == 'development'
    needs: e2e-tests
    steps:      
    # - uses: actions/checkout@v4
    - name: Build Feature Environment
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}    
      run: |
        echo "in push dev registry"
        echo "$GITHUB_CONTEXT"    

  code-engine-deploy:
    runs-on: ubuntu-latest
    needs: push-dev-registry
    if: github.ref_name == 'development'
    steps:      
    - uses: actions/checkout@v4
    - name: Build Feature Environment
      run: |
        echo "code engine deploy based on checks in script"

  push-prod-registry:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'release')
    needs: e2e-tests
    steps:      
    # - uses: actions/checkout@v4
    - name: Build Feature Environment
      run: |
        echo "in prod registry"
